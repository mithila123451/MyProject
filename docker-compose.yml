services:
  app:
    image: nginx:latest
    ports:
      - "80:80"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_backend
    restart: unless-stopped

    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: attendance_user
      DB_PASSWORD: attendance123
      DB_NAME: attendance_db

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: attendance_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: attendance_db
      MYSQL_USER: attendance_user
      MYSQL_PASSWORD: attendance123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: